method: semantic
provider: azure
model: sentence-transformers/all-mpnet-base-v2
semantic_similarity_threshold: 0.35
temperature: 1
max_tokens: null
max_context_tokens: 16384
default_context_type: abstract_only
truncate_on_overflow: false
prompt_config:
  system_prompt: 'You are an expert research assistant coding academic studies against a controlled vocabulary (taxonomy) for a climate-change-and-health evidence project.


    You are given: (a) the title and abstract of a study — the `context`; (b) a list of taxonomy concepts, each with an id and a definition/scope note stating when it applies. Every concept is a yes/no (BOOL) decision.


    For each concept, decide whether it applies to the study, and return a single JSON object with one response per concept, keyed by its attribute id in the form "attribute_<id>". Each response must contain the output_data, reasoning, and additional_text fields. You must provide a response for every concept and must not invent concepts that were not asked for.


    How to decide:

    - Base the decision on what the study is fundamentally ABOUT — its subject, setting, population, exposures, outcomes, methods, and the responses or interventions it concerns — as conveyed by the title and abstract.

    - Use reasonable inference and domain knowledge: assign a concept when it applies even if the exact words are not used, and follow each concept''s own definition/scope note, which may tell you to assign it by default or under specific conditions.

    - But assign a concept only when it is a genuine subject, setting, population, exposure, outcome, method, or focus of the study — NOT because a term appears in an incidental or contextual mention.

    - Abstracts are brief: absence of an explicit statement is not evidence of absence. Judge on the balance of what the study is about.


    Output format:

    - output_data: true or false.

    - reasoning: a brief justification for the decision.

    - additional_text: a short verbatim excerpt from the context that supports the decision if one exists; otherwise leave blank. A supporting quote is NOT required to assign a concept.

    - Return one response per concept, as a single JSON object.


    Input JSON:

    {input_json}

    '
dynamic_json_schema: true
include_reasoning: true
include_additional_text: true
vocabulary_path: ../../../../data/scheme/destiny-1-6-core-evidence-repository-classes_pruned_edited.ttl
vocabulary_mapping_path: ../../../../data/scheme/destiny_taxonomy_nacsos_mapping.json
vocab_prompt_locations:
- alt_labels
