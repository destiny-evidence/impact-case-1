[project]
name = "climate-health"
version = "0.0.1"
description = "Climate & health map (DESTinY IC1)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rdflib>=7.6.0",
    "dvc[azure]>=3.67.1",
    "dvc-ssh>=4.3.0",
    "frictionless[pandas]>=5.19.0",
    "rispy==0.10.0",
    "rich>=14.0.0",
    "prob-conf-mat>=0.4.0",
    "statsmodels>=0.15.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
classify = [
    "transformers[torch,optuna,sentencepiece]==5.14.1",
    "datasets==5.0.0",
    "lightgbm==4.7.0",
    "scikit-learn>=1.6",
]
deet = [
    "destiny-deet",
]
nacsos = [
    "nacsos_data[utils,scripts]",
]
querying = [
    "lark==1.3.1",
]
[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "marimo>=0.24.0",
    "ty>=0.0.90",
]

[tool.uv.sources]
nacsos_data = [
    { git = "git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git", tag = "v0.24.53" },
]
destiny-deet = { git = "https://github.com/destiny-evidence/data-extraction-evaluation-toolkit.git", branch = "feature/316-hierarchical-attribute-taxonomy" }

[project.scripts]
ic1 = "ic1:main"

[tool.uv.workspace]
members = [
    ".",
]

[build-system]
requires = ["uv-build>=0.9.10,<=0.11.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ic1"
module-root = ""


[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py313"
include = ["pyproject.toml", "ic1/**/*.py", "notebooks/**/*.py"]
exclude = []

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "B9"]
ignore = ["E203", "E501", "E712", "E741", "B010", "B009", "B904", "B008"]  # , "E126", "W503",

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Marimo idioms: bare expressions render cell output (B018); imports live in the cell that needs them (E402).
[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018", "E402"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 12

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

# Scope gate: widen `include` as each family is triaged; families outside it are unchecked.
# Run in the full environment (`uv run --all-extras ty check`) so every extra's imports resolve.
[tool.ty.src]
include = ["ic1/core", "ic1/classify", "ic1/evaluation_splits", "ic1/reporting", "ic1/annotation"]
