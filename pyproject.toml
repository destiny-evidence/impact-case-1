[project]
name = "climate-health"
version = "0.0.1"
description = "Climate & health map (DESTinY IC1)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nacsos_data[utils,scripts]",
    "rdflib>=7.6.0",
    "dvc>=3.67.1",
    "dvc-ssh>=4.3.0",
    "frictionless[pandas]>=5.19.0",
]

[project.optional-dependencies]
classify = [
    "transformers[torch,transformers,optuna]==5.14.1",
    "datasets==5.0.0",
    "lightgbm==4.7.0",
]
deet = [
    "data-extraction-evaluation-toolkit",
]
querying = [
    "lark==1.3.1",
]
[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "ruff>=0.15.20",
    "pandas-stubs~=3.0.3",
]

[tool.uv.sources]
nacsos_data = [
    { git = "git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git", tag = "v0.24.50" },
]
data-extraction-evaluation-toolkit = { git = "https://github.com/destiny-evidence/data-extraction-evaluation-toolkit.git", rev = "feature/%2317-train-test-splits" }

[tool.uv]
conflicts = [
    [
        { extra = "classify" },
        { extra = "deet" },
    ],
]

[project.scripts]
ic1 = "ic1:main"

[tool.uv.workspace]
members = [
    ".",
]

[build-system]
requires = ["uv-build>=0.9.10,<=0.11.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ic1"
module-root = ""


[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py313"
include = ["pyproject.toml", "ic1/**/*.py"]
exclude = []

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "B9"]
ignore = ["E203", "E501", "E712", "E741", "B010", "B009", "B904", "B008"]  # , "E126", "W503",

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 12

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.mypy]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
follow_imports = "silent"

files = ["ic1/classify"]
exclude = []

check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
strict_optional = true
explicit_package_bases = false
show_traceback = true
incremental = false

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
