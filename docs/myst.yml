project:
  id: destiny-ic1
  title: DESTINY IC1 — screening and taxonomy-annotation of climate and health studies
  description: >-
    Documentation of a combined ML and LLM pipeline for screening and annotating
    climate and health studies
  authors:
    - name: Max Callaghan
      email: max.callaghan@pik-potsdam.de
    - name: Tim Repke
      email: tim.repke@pik-potsdam.de
